<!doctype html>
<!-- WebGPU's page for apps.sh (PAGE=webgpu-page.html) and tools/safari-page.sh: WebGPU runs on Metal through Dawn
     (Chromium; Tint writes the MSL) or WebKit (Safari), a shader generator of its own next to ANGLE, MoltenVK and SceneKit.
     A compute pass (integer and float math, a loop, workgroup memory with a barrier, atomics), a 4x multisampled render
     with varyings resolved to a texture, and texture sampling (nearest and linear) with a depth test; every result is
     read back and checked against the value computed here. Logs "apps.sh: done" or "apps.sh: error: ..." as apps-page.html
     does ("apps.sh: error: no WebGPU adapter" where the browser offers none on this GPU). -->
<html><head><meta charset="utf-8"><title>running</title></head>
<body>
<script>
function send(m) { console.log(m); if (location.search.includes('report=1')) fetch('/result', {method: 'POST', body: m}).catch(() => {}); }
function fail(m) { document.title = 'error: ' + m; send('apps.sh: error: ' + m); }

async function readBuffer(device, src, size) {
  const dst = device.createBuffer({size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ});
  const enc = device.createCommandEncoder();
  enc.copyBufferToBuffer(src, 0, dst, 0, size);
  device.queue.submit([enc.finish()]);
  await dst.mapAsync(GPUMapMode.READ);
  const copy = dst.getMappedRange().slice(0);
  dst.unmap();
  return copy;
}

async function readTexture(device, tex, w, h) {  // rgba8unorm, rows padded to 256 bytes
  const row = Math.ceil(w * 4 / 256) * 256;
  const buf = device.createBuffer({size: row * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ});
  const enc = device.createCommandEncoder();
  enc.copyTextureToBuffer({texture: tex}, {buffer: buf, bytesPerRow: row}, [w, h]);
  device.queue.submit([enc.finish()]);
  await buf.mapAsync(GPUMapMode.READ);
  const bytes = new Uint8Array(buf.getMappedRange().slice(0));
  buf.unmap();
  return (x, y) => Array.from(bytes.subarray(y * row + x * 4, y * row + x * 4 + 4));
}

const near = (a, b, tol) => a.every((v, i) => Math.abs(v - b[i]) <= tol);

async function compute(device) {
  const N = 256;
  const code = `
    @group(0) @binding(0) var<storage, read_write> out: array<u32>;
    @group(0) @binding(1) var<storage, read_write> fout: array<f32>;
    @group(0) @binding(2) var<storage, read_write> total: atomic<u32>;
    var<workgroup> shared_: array<u32, 64>;
    @compute @workgroup_size(64)
    fn main(@builtin(global_invocation_id) gid: vec3u, @builtin(local_invocation_index) li: u32) {
      let i = gid.x;
      var acc = 0u;
      for (var k = 0u; k <= i % 13u; k++) { acc += (i * 7u + k * k) ^ (k << 3u); }
      shared_[li] = acc;
      workgroupBarrier();
      let other = shared_[63u - li];
      out[i] = acc + other / 2u;
      fout[i] = sqrt(f32(i) + 1.0) * 0.5 + f32(i % 5u) * 0.25;
      atomicAdd(&total, i);
    }`;
  const pipe = device.createComputePipeline({layout: 'auto', compute: {module: device.createShaderModule({code}), entryPoint: 'main'}});
  const mk = size => device.createBuffer({size, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC});
  const out = mk(N * 4), fout = mk(N * 4), total = mk(4);
  const bind = device.createBindGroup({layout: pipe.getBindGroupLayout(0),
    entries: [{binding: 0, resource: {buffer: out}}, {binding: 1, resource: {buffer: fout}}, {binding: 2, resource: {buffer: total}}]});
  const enc = device.createCommandEncoder();
  const pass = enc.beginComputePass();
  pass.setPipeline(pipe); pass.setBindGroup(0, bind); pass.dispatchWorkgroups(N / 64); pass.end();
  device.queue.submit([enc.finish()]);
  const got = new Uint32Array(await readBuffer(device, out, N * 4)), fgot = new Float32Array(await readBuffer(device, fout, N * 4));
  const tot = new Uint32Array(await readBuffer(device, total, 4))[0];
  const accOf = i => { let a = 0; for (let k = 0; k <= i % 13; k++) a = (a + (((i * 7 + k * k) ^ (k << 3)) >>> 0)) >>> 0; return a; };
  for (let i = 0; i < N; i++) {
    const g = Math.floor(i / 64) * 64, want = (accOf(i) + Math.floor(accOf(g + 63 - (i - g)) / 2)) >>> 0;
    if (got[i] !== want) throw new Error(`compute: out[${i}] = ${got[i]}, want ${want}`);
    const fw = Math.sqrt(i + 1) * 0.5 + (i % 5) * 0.25;
    if (Math.abs(fgot[i] - fw) > 1e-5 * Math.max(1, fw)) throw new Error(`compute: fout[${i}] = ${fgot[i]}, want ${fw}`);
  }
  if (tot !== N * (N - 1) / 2) throw new Error(`compute: atomic total ${tot}, want ${N * (N - 1) / 2}`);
}

async function render(device) {
  const W = 64;
  const code = `
    struct V { @builtin(position) p: vec4f, @location(0) c: vec4f, @location(1) @interpolate(flat) id: u32 };
    @vertex fn vs(@builtin(vertex_index) i: u32) -> V {
      var p = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
      var v: V; v.p = vec4f(p[i], 0, 1); v.c = vec4f(0.25, 0.5, 0.75, 1.0); v.id = 7u; return v;
    }
    @fragment fn fs(v: V) -> @location(0) vec4f { return vec4f(v.c.rgb, f32(v.id) / 8.0); }`;
  const module = device.createShaderModule({code});
  const pipe = device.createRenderPipeline({layout: 'auto', vertex: {module, entryPoint: 'vs'},
    fragment: {module, entryPoint: 'fs', targets: [{format: 'rgba8unorm'}]}, multisample: {count: 4}});
  const msaa = device.createTexture({size: [W, W], sampleCount: 4, format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT});
  const resolved = device.createTexture({size: [W, W], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC});
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({colorAttachments: [{view: msaa.createView(), resolveTarget: resolved.createView(),
    clearValue: [0, 0, 0, 0], loadOp: 'clear', storeOp: 'discard'}]});
  pass.setPipeline(pipe); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
  const px = await readTexture(device, resolved, W, W), want = [64, 128, 191, 223];
  for (const [x, y] of [[0, 0], [31, 31], [63, 63], [5, 50]])
    if (!near(px(x, y), want, 2)) throw new Error(`render (4x MSAA, resolved): pixel (${x}, ${y}) = ${px(x, y)}, want ${want}`);
}

async function sampling(device) {
  // a 4x4 texture of distinct colours, drawn twice over a 64x64 target: once nearest at depth 0.5, then linear at depth
  // 0.75 with depth test "less", which must leave the nearest one everywhere; then linear alone in a second target
  const data = new Uint8Array(4 * 4 * 4);
  for (let i = 0; i < 16; i++) data.set([i * 16, 255 - i * 16, (i % 4) * 80, 255], i * 4);
  const tex = device.createTexture({size: [4, 4], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST});
  device.queue.writeTexture({texture: tex}, data, {bytesPerRow: 16}, [4, 4]);
  const code = `
    @group(0) @binding(0) var t: texture_2d<f32>;
    @group(0) @binding(1) var s: sampler;
    struct U { depth: f32 };
    @group(0) @binding(2) var<uniform> u: U;
    struct V { @builtin(position) p: vec4f, @location(0) uv: vec2f };
    @vertex fn vs(@builtin(vertex_index) i: u32) -> V {
      var p = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
      var v: V; v.p = vec4f(p[i], u.depth, 1); v.uv = vec2f(p[i].x + 1.0, 1.0 - p[i].y) * 0.5; return v;
    }
    @fragment fn fs(v: V) -> @location(0) vec4f { return textureSample(t, s, v.uv); }`;
  const module = device.createShaderModule({code});
  const W = 64;
  const make = depth => device.createRenderPipeline({layout: 'auto', vertex: {module, entryPoint: 'vs'},
    fragment: {module, entryPoint: 'fs', targets: [{format: 'rgba8unorm'}]},
    depthStencil: depth ? {format: 'depth32float', depthWriteEnabled: true, depthCompare: 'less'} : undefined});
  const withDepth = make(true), noDepth = make(false);
  const target = () => device.createTexture({size: [W, W], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC});
  const a = target(), b = target();
  const depthTex = device.createTexture({size: [W, W], format: 'depth32float', usage: GPUTextureUsage.RENDER_ATTACHMENT});
  const sampler = f => device.createSampler({magFilter: f, minFilter: f});
  const uniform = d => { const u = device.createBuffer({size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST});
                         device.queue.writeBuffer(u, 0, new Float32Array([d, 0, 0, 0])); return u; };
  const group = (pipe, f, d) => device.createBindGroup({layout: pipe.getBindGroupLayout(0),
    entries: [{binding: 0, resource: tex.createView()}, {binding: 1, resource: sampler(f)}, {binding: 2, resource: {buffer: uniform(d)}}]});
  const enc = device.createCommandEncoder();
  let pass = enc.beginRenderPass({colorAttachments: [{view: a.createView(), clearValue: [0, 0, 0, 0], loadOp: 'clear', storeOp: 'store'}],
    depthStencilAttachment: {view: depthTex.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store'}});
  pass.setPipeline(withDepth);
  pass.setBindGroup(0, group(withDepth, 'nearest', 0.5)); pass.draw(3);
  pass.setBindGroup(0, group(withDepth, 'linear', 0.75)); pass.draw(3);
  pass.end();
  pass = enc.beginRenderPass({colorAttachments: [{view: b.createView(), clearValue: [0, 0, 0, 0], loadOp: 'clear', storeOp: 'store'}]});
  pass.setPipeline(noDepth); pass.setBindGroup(0, group(noDepth, 'linear', 0.5)); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
  const pa = await readTexture(device, a, W, W), pb = await readTexture(device, b, W, W);
  const texel = (x, y) => Array.from(data.subarray((y * 4 + x) * 4, (y * 4 + x) * 4 + 4));
  for (const [x, y] of [[2, 2], [21, 9], [40, 61], [62, 33]]) {  // nearest: the texel under the pixel centre
    const want = texel(Math.floor(x / 16), Math.floor(y / 16));
    if (!near(pa(x, y), want, 1)) throw new Error(`sampling (nearest, depth test): pixel (${x}, ${y}) = ${pa(x, y)}, want ${want}`);
  }
  // linear around the corner of texels (1,1) and (2,1): pixels 31 and 32 straddle the column boundary, rows 23 and 24 the
  // middle of texel row 1 (the texture is linear across rows, so their blend with rows 0 and 2 cancels): their average
  const t1 = texel(1, 1), t2 = texel(2, 1), mid = t1.map((v, i) => (v + t2[i]) / 2);
  const got = [0, 1, 2, 3].map(i => (pb(31, 23)[i] + pb(32, 23)[i] + pb(31, 24)[i] + pb(32, 24)[i]) / 4);
  if (!near(got, mid, 3)) throw new Error(`sampling (linear): around (32, 24) = ${got}, want ${mid}`);
}

(async () => {
  try {
    if (!navigator.gpu) return fail('no WebGPU (navigator.gpu missing)');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return fail('no WebGPU adapter');
    const info = adapter.info || {};
    console.log(`webgpu-page: adapter ${info.vendor || '?'} ${info.architecture || ''} ${info.description || ''}`.trim());
    const device = await adapter.requestDevice();
    const lost = device.lost.then(l => fail('device lost: ' + l.message));
    device.addEventListener('uncapturederror', e => fail('uncaptured error: ' + e.error.message));
    await compute(device);
    await render(device);
    await sampling(device);
    document.title = 'done'; send('apps.sh: done');
  } catch (e) { fail(e.message || String(e)); }
})();
</script>
</body></html>
